<!doctype html>
<html>
  <head>
    <title>Deltrix's Page</title>
    <meta property="og:title" content="Deltrix's Page" />
    <meta
      property="og:description"
      content="I should be working, instead I'm doing this."
    />
  </head>
  <body style="padding: 0; margin: 0">
    <div
      onClick="playRaccoon()"
      style="
        width: 100%;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #000;
        position: relative;
        cursor: pointer;
      "
    >
      <h1 id="intro" style="color: white">Click here</h1>
      <video
        id="raccoonvid"
        playsinline
        autoplay
        muted
        loop
        style="width: 100%; height: auto; display: none"
      >
        <source src="raccoon.mp4" type="video/mp4" />
        Your browser does not support the video tag.</video
      ><audio id="raccoonaud" src="funkytown.mp3" autoplay=""></audio>
    </div>
  </body>
  <script>
    const playRaccoon = () => {
      const intro = document.getElementById("intro");
      intro.style.display = "none";
      const video = document.getElementById("raccoonvid");
      video.style.display = "block";
      video.play();
      const audio = document.getElementById("raccoonaud");
      audio.play();
    };
  </script>
</html>
